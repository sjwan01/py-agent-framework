name: CI

# Triggers:
# - push to main: verify the merged state. Branch pushes are covered by
#   pull_request, so there are no double runs; tags are not matched by
#   `branches: [main]`.
# - pull_request: verify the PR head (re-runs on each push to the branch).
# paths-ignore: docs-only changes (.md / LICENSE) skip CI entirely. The
# .github/ directory is deliberately NOT ignored — CI changes must be
# verified by CI.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pyagent_test
          POSTGRES_USER: pyagent
          POSTGRES_PASSWORD: pyagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyagent -d pyagent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_TEST_URL: postgresql://pyagent:pyagent@localhost:5432/pyagent_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Cache the venv across runs. The key is python version + dependency
      # manifest, so dependency changes bust the cache; restore-keys reuse a
      # stale venv for an incremental `pip install` when only the manifest
      # drifted slightly.
      - name: Cache venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: venv
          key: venv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            venv-${{ matrix.python-version }}-
      - name: Set up virtualenv and install package
        run: make bootstrap
      - name: Run checks (lint + typecheck + test, incl. Postgres)
        run: make check
